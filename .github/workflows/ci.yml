name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Shellcheck
        run: |
          set -euo pipefail
          # Lint every tracked shell script plus the extensionless curl mock,
          # NUL-delimited so new script dirs are covered without editing this list.
          { git ls-files -z '*.sh'; printf 'tests/lib/curl\0'; } \
            | xargs -0 shellcheck --severity=warning

      - name: Actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          # Download a pinned actionlint and verify it against the release's own
          # checksums file before running. actionlint auto-detects shellcheck on
          # PATH (preinstalled here), so embedded `run:` scripts are linted too.
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$tarball" "${base}/${tarball}"
          curl -fsSL -o checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "  ${tarball}$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" actionlint
          ./actionlint -color

      - name: Validate JSON fixtures and predicate schemas
        run: |
          set -euo pipefail
          find tests/fixtures predicates -name '*.json' -print0 \
            | while IFS= read -r -d '' f; do
                echo "Validating $f"
                jq . "$f" >/dev/null
              done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run fixture-driven test suites
        run: bash tests/run-tests.sh

